<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Análisis de Propagación</title>
  <link rel="stylesheet" href="style.css">
  <!-- Cargamos D3 v7 desde el CDN -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <div id="app">

    <!-- BARRA SUPERIOR: Filtros de Campaña -->
    <div id="top-bar">
      <span class="label">CAMPAÑA:</span>
      <div id="campaign-filters"></div>
      <div id="clock-container">
        <span id="clock-date">—</span> · <span id="clock-time">—</span>
      </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div id="content">
      
      <!-- COLUMNA IZQUIERDA (Se ajusta dinámicamente) -->
      <div id="left-column">
        
        <!-- Gráfico 1: Árbol Radial -->
        <div id="main-chart"></div>

        <!-- Consola Inferior: SaidIT -->
        <div id="bottom-console" class="collapsed">
          <div id="console-header">
            <span class="console-title">🌐 SaidIT Filtraciones</span>
            <button id="toggle-console-btn">Expandir ▲</button>
          </div>
          <div id="console-body">
            <div id="saidit-table-container"></div>
          </div>
        </div>

      </div>

      <!-- PANEL LATERAL DERECHO (Topología) -->
      <div id="side-panel">
        <div id="side-header">
          <span id="side-title">Detalle de Propagación</span>
          <button id="close-btn">Cerrar ✖</button>
        </div>
        <div id="side-chart"></div>
      </div>

    </div>

    <!-- LÍNEA DE TIEMPO GLOBAL -->
    <div id="timeline-container">
      <div id="play-btn">▶ Play</div>
      <div id="slider-wrapper">
        <svg id="timeline-svg"></svg>
      </div>
      <div id="stats-label">Cargando...</div>
    </div>
  </div>

  <script src="js/state.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
